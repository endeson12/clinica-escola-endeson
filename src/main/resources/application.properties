spring.application.name=clinica-escola

# Porta: a Vercel injeta PORT (padrao 80 no conteiner); localmente usa 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Banco: ver config/DataSourceConfig (le JDBC_DATABASE_URL ou DATABASE_URL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migracoes versionadas (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sessao no PostgreSQL (tabelas criadas pela migracao V3)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=CLINICA_SESSION

# Usuarios de demonstracao (senhas SOMENTE por variavel de ambiente)
app.demo.admin.email=${DEMO_ADMIN_EMAIL:}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:}
app.demo.recepcao.email=${DEMO_RECEPCAO_EMAIL:}
app.demo.recepcao.password=${DEMO_RECEPCAO_PASSWORD:}

logging.level.org.springframework.security=WARN
