name: clinica-escola-homolog
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?Defina a senha privada do banco}
    volumes:
      - portal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 1
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    security_opt:
      - no-new-privileges:true
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: clinica-escola-portal:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-18182}:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/portal
      DB_USERNAME: portal
      DB_PASSWORD: ${PORTAL_DB_PASSWORD:?Defina a senha privada do banco}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEMO_USERS_ENABLED: ${PORTAL_BOOTSTRAP_ENABLED:-false}
      DEMO_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:?Defina o email administrativo}
      DEMO_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?Defina a senha administrativa privada}
      DEMO_RECEPCAO_EMAIL: ${PORTAL_RECEPCAO_EMAIL:?Defina o email de recepcao}
      DEMO_RECEPCAO_PASSWORD: ${PORTAL_RECEPCAO_PASSWORD:?Defina a senha de recepcao privada}
    mem_limit: 768m
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  portal_pg:
